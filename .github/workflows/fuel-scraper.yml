name: Daily Fuel Price Scraper

on:
  schedule:
    # Türkiye Saati (UTC+3) ile gece 00:05 = UTC Saatiyle 21:05
    - cron: '5 21 * * *'
  workflow_dispatch: # GitHub üzerinden butonla manuel tetiklemek için

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/fetchFuelPrices.js